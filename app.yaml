alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
features:
  - buildpack-stack=ubuntu-22
ingress:
  rules:
    - component:
        name: mlnbk-portfolio
      match:
        authority:
          exact: ''
        path:
          prefix: /
name: portfolio
region: fra
services:
  - build_command: npm run build
    environment_slug: node-js
    github:
      branch: main
      deploy_on_push: true
      repo: mlnbk/mlnbk_portfolio
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    name: mlnbk-portfolio
    run_command: npm run start
    source_dir: /
